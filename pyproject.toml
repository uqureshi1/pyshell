[project]
name = "pyshell"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyreadline3; sys_platform == 'win32'",
]

[project.scripts]
pyshell = "pyshell.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM115", # deferred-close file handles passed into subprocess Popen calls
]

[tool.ruff.format]
quote-style = "double"
